server {
  listen 443 ssl;
  http2 on;
  server_name soda.buplayground.cn;
  ssl_certificate /data/app/huanghaibin/web/letsencrypt/live/soda.buplayground.cn/fullchain.pem;
  ssl_certificate_key /data/app/huanghaibin/web/letsencrypt/live/soda.buplayground.cn/privkey.pem;
  auth_request /_soda_gate_check;
  error_page 401 = @soda_gate_login;
  location = /_soda_gate_check {
    internal;
    proxy_pass http://127.0.0.1:3100/gate/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }
  location @soda_gate_login { return 302 https://$host/gate/login?next=$request_uri; }
  location = /gate/login { auth_request off; limit_req zone=login burst=10 nodelay; proxy_pass http://127.0.0.1:3100; }
  location = /gate/logout { auth_request off; proxy_pass http://127.0.0.1:3100; }
  location = /robots.txt { auth_request off; return 200 "User-agent: *\nDisallow: /\n"; }
  limit_req zone=perip burst=400 nodelay;
  client_max_body_size 8m;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location / {
    proxy_pass http://127.0.0.1:3214;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 240s;
    proxy_buffering off;
  }
}
